<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>HomeWork – Gering Digital</title>
<link rel="stylesheet" href="assets/homework.css?v=20261120b">
<script src="assets/homework.js?v=20261120b" defer></script>
</head>
<body>
<div class="workspace hidden" id="app">
  <aside class="sidebar" aria-label="HomeWork-Kategorien">
    <div class="brand"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><strong>HomeWork</strong></div>
    <p class="sidebar-label">Oberkategorien</p>
    <nav id="categoryNav" class="category-nav" aria-label="Kategorien"></nav>
    <button id="categoryCreate" type="button" class="category-create">+ Neue Kategorie</button>
  </aside>
  <main class="content" id="inhalt">
    <header class="topbar">
      <span>GERING DIGITAL <span class="slash">/</span> <b>HOMEWORK</b> <span class="slash">/</span> PRIVAT</span>
      <button id="logout" class="outline-button" type="button">Abmelden</button>
    </header>
    <div class="page-heading">
      <h1>HomeWork</h1>
      <div class="summary" aria-label="Modulübersicht">
        <div><strong id="totalCount">0</strong><small>Module</small></div>
        <div><strong id="doneCount">0</strong><small>Fertig</small></div>
      </div>
    </div>
    <section class="upload-panel" aria-labelledby="upload-heading">
      <div class="upload-header">
        <span class="upload-symbol" aria-hidden="true">+</span>
        <h2 id="upload-heading">Unterrichtsmaterial hinzufügen</h2>
        <button id="toggleUpload" class="gold-button" type="button" aria-expanded="false" aria-controls="uploadFields">+ Datei hinzufügen</button>
      </div>
      <div id="uploadFields" class="upload-fields hidden">
        <div class="form-grid">
          <label>Titel der Kachel<input id="title" maxlength="140" placeholder="Titel des Moduls"></label>
          <label>Thema<input id="topic" maxlength="100" placeholder="z. B. IT-Support"></label>
          <label>Oberkategorie<select id="uploadCategory"></select></label>
          <label>Datum<input id="date" type="date"></label>
        </div>
        <div class="upload-bottom">
          <label class="file-label">HTML-Datei auswählen<input id="file" type="file" accept=".html,.htm,text/html"></label>
          <button id="upload" class="gold-button" type="button">HTML-Datei hochladen</button>
        </div>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section class="module-section" aria-labelledby="sectionTitle">
      <div class="list-heading">
        <div>
          <h2 id="sectionTitle">Alle HTML-Module</h2>
          <p id="count" aria-live="polite"></p>
        </div>
        <div class="list-tools">
          <div class="legend"><span class="dot green"></span>Fertig <span class="dot yellow"></span>In Arbeit <span class="dot red"></span>Offen</div>
          <label class="search-label"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Module suchen …" aria-label="Module suchen"></label>
        </div>
      </div>
      <div id="modules" class="module-grid"></div>
    </section>
  </main>
</div>

<div class="login" id="login">
  <form id="loginForm" class="login-box">
    <span class="login-label">GERING DIGITAL · PRIVAT</span>
    <h2>HomeWork</h2>
    <p>Mit dem Passwort der Bewerbungsseite anmelden.</p>
    <label class="visually-hidden" for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="gold-button" type="submit">Anmelden</button>
    <p id="error" role="alert"></p>
  </form>
</div>

<dialog id="editDialog" aria-labelledby="editHeading" class="homework-dialog">
  <form id="editForm">
    <h2 id="editHeading">Modul bearbeiten</h2>
    <input id="editId" type="hidden">
    <label>Titel<input id="editTitle" required maxlength="140"></label>
    <label>Oberkategorie<select id="editCategory"></select></label>
    <p id="editError" role="alert"></p>
    <div class="dialog-actions">
      <button class="outline-button" type="button" id="cancelEdit">Abbrechen</button>
      <button class="gold-button" type="submit" id="saveEdit">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="categoryDialog" aria-labelledby="categoryHeading" class="homework-dialog">
  <form id="categoryForm">
    <h2 id="categoryHeading">Neue Kategorie</h2>
    <label>Name<input id="categoryName" maxlength="60" required placeholder="Kategoriename"></label>
    <p id="categoryError" role="alert"></p>
    <div class="dialog-actions">
      <button class="outline-button" type="button" id="cancelCategory">Abbrechen</button>
      <button class="gold-button" type="submit" id="saveCategory">Erstellen</button>
    </div>
  </form>
</dialog>
</body>
</html>
