name: Deploy Gering Digital to STRATO (SFTP)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_PORT: ${{ secrets.STRATO_PORT }}
      STRATO_USER: ${{ secrets.STRATO_USER }}
      STRATO_PASSWORD: ${{ secrets.STRATO_PASSWORD }}
      STRATO_REMOTE_PATH: ${{ secrets.STRATO_REMOTE_PATH }}
      STRATO_KNOWN_HOSTS: ${{ secrets.STRATO_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore NERD FM audio from verified binary parts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          parts_dir = Path('dau-to-pro/audio/nerd-fm/.deja-vu')
          parts = [parts_dir / f'{n:02d}.part' for n in range(1, 13)]
          if not all(part.is_file() for part in parts):
              raise SystemExit('NERD FM: one or more original audio parts are missing')
          destination = Path('dau-to-pro/audio/nerd-fm/deja-vu.mp3')
          digest = hashlib.sha256()
          with destination.open('wb') as audio:
              for part in parts:
                  with part.open('rb') as source:
                      while chunk := source.read(65536):
                          audio.write(chunk)
                          digest.update(chunk)
          if digest.hexdigest() != 'd0237879a192fd409c60c066a2b264f3e87eb6b524ecc2449d7c30a90b01dd80':
              destination.unlink(missing_ok=True)
              raise SystemExit('NERD FM: source audio integrity verification failed')
          print('Restored original Diggy Thal - Déjà-vu MP3:', destination.stat().st_size, 'bytes')
          PY

      - name: Build the self-hosted PDF editor (pinned npm version)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/gd-pdf-editor" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund pdf-lib@1.17.1
          mkdir -p assets/lib
          cp "$RUNNER_TEMP/gd-pdf-editor/node_modules/pdf-lib/dist/pdf-lib.min.js" assets/lib/pdf-lib.min.js
          test -s assets/lib/pdf-lib.min.js

      - name: Install SFTP client
        run: python -m pip install --disable-pip-version-check 'paramiko>=3.4,<5'

      - name: Upload tracked website files only (never delete remote files)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import posixpath
          import subprocess
          import tempfile

          import paramiko

          required = ('STRATO_HOST', 'STRATO_USER', 'STRATO_PASSWORD',
                      'STRATO_REMOTE_PATH', 'STRATO_KNOWN_HOSTS')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing GitHub Secrets: ' + ', '.join(missing))

          remote_root = os.environ['STRATO_REMOTE_PATH'].strip().rstrip('/') or '/'
          if not remote_root.startswith('/') or remote_root == '':
              raise SystemExit('STRATO_REMOTE_PATH must be an absolute SFTP path')
          port = int(os.environ.get('STRATO_PORT') or '22')
          if not 1 <= port <= 65535:
              raise SystemExit('Invalid SFTP port')

          # Never upload application-generated content, account data, or secrets.
          blocked_dirs = {'data', 'uploads', 'runtime', 'node_modules', '.git',
                          '.github', 'tests', 'test', '__pycache__', 'vendor'}
          blocked_suffixes = ('.sqlite', '.sqlite3', '.db', '.bak', '.log', '.sql',
                              '.pem', '.key', '.p12', '.pfx', '.zip', '.tar', '.gz')
          allowed_suffixes = {'.php', '.html', '.htm', '.css', '.js', '.mjs',
                              '.json', '.png', '.jpg', '.jpeg', '.webp',
                              '.svg', '.gif', '.ico', '.woff', '.woff2',
                              '.ttf', '.otf', '.txt', '.xml', '.webmanifest',
                              '.map', '.wasm', '.mp4', '.mp3', '.wav', '.ogg', '.m4a'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          deploy_files = []
          for raw in tracked:
              if not raw:
                  continue
              relative = pathlib.PurePosixPath(os.fsdecode(raw))
              parts = relative.parts
              if (relative.is_absolute() or '..' in parts
                      or any(p in blocked_dirs or p.lower().endswith('uploads') for p in parts[:-1])
                      or any(p.startswith('.') for p in parts[:-1])
                      or parts[-1].startswith('.env')
                      or parts[-1].lower().endswith(blocked_suffixes)):
                  continue
              if relative.suffix.lower() not in allowed_suffixes and relative.name != '.htaccess':
                  continue
              path = pathlib.Path(*parts)
              if not path.is_file() or path.is_symlink():
                  continue
              deploy_files.append((path, relative.as_posix()))

          # Runtime-built, pinned, self-hosted library. Never load third-party JS
          # directly on pages handling private application documents.
          pdf_editor = pathlib.Path('assets/lib/pdf-lib.min.js')
          if not pdf_editor.is_file() or pdf_editor.stat().st_size < 100000:
              raise SystemExit('PDF library missing; refusing broken application deployment')
          deploy_files.append((pdf_editor, pdf_editor.as_posix()))

          # The NERD FM MP3 is losslessly assembled above from tracked parts; deploy it
          # alongside the tracked files while keeping the parts off the public server.
          assembled_audio = pathlib.Path('dau-to-pro/audio/nerd-fm/deja-vu.mp3')
          if assembled_audio.is_file() and not any(relative == assembled_audio.as_posix() for _, relative in deploy_files):
              deploy_files.append((assembled_audio, assembled_audio.as_posix()))

          # Install additive XP dependencies before PHP entry points can reference them.
          # The compatibility guard in xp_lib.php lets old/new achievement code coexist during upload.
          first = ['module_release_lib.php', 'xp-config.json', 'xp_lib.php', 'lib.php',
                   'dau-to-pro/profiles.js', 'dau-to-pro/progress-panels.php',
                   'dau-to-pro/api/profile.php']
          priority = {name: i for i, name in enumerate(first)}
          deploy_files.sort(key=lambda item: (priority.get(item[1], len(first)), item[1]))

          if not deploy_files:
              raise SystemExit('No deployable website files found; refusing empty deployment')

          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8') as known_file:
              known_file.write(os.environ['STRATO_KNOWN_HOSTS'].strip() + '\n')
              known_file.flush()
              ssh = paramiko.SSHClient()
              ssh.load_host_keys(known_file.name)
              ssh.set_missing_host_key_policy(paramiko.RejectPolicy())
              ssh.connect(
                  hostname=os.environ['STRATO_HOST'].strip(),
                  port=port,
                  username=os.environ['STRATO_USER'],
                  password=os.environ['STRATO_PASSWORD'],
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=25,
              )
              try:
                  sftp = ssh.open_sftp()
                  try:
                      sftp.stat(remote_root)  # The destination MUST already exist.
                      # This account is chrooted to the website root. Verify expected site markers.
                      for marker in ('index.php', 'lib.php', 'dau-to-pro'):
                          sftp.stat(posixpath.join(remote_root, marker))
                      directories = set()
                      for local, relative in deploy_files:
                          target = posixpath.join(remote_root, relative)
                          parent = posixpath.dirname(target)
                          if parent not in directories:
                              current = remote_root
                              for component in relative.split('/')[:-1]:
                                  current = posixpath.join(current, component)
                                  if current not in directories:
                                      try:
                                          sftp.stat(current)
                                      except OSError:
                                          sftp.mkdir(current)
                                      directories.add(current)
                          sftp.put(str(local), target, confirm=True)
                          print('Uploaded:', relative)
                      # Publish the activation receipt LAST, atomically. Partial uploads never activate modules.
                      manifest_path = pathlib.Path('lernmodule/manifest.json')
                      manifest = json.loads(manifest_path.read_text())
                      release_files = ['manifest.json'] + [m['file'] for m in manifest['modules']]
                      receipt = json.dumps({'files': {
                          name: hashlib.sha256((pathlib.Path('lernmodule') / name).read_bytes()).hexdigest()
                          for name in release_files
                      }}, sort_keys=True).encode()
                      release_target = posixpath.join(remote_root, 'lernmodule/release.json')
                      sftp.putfo(io.BytesIO(receipt), release_target + '.tmp', confirm=True)
                      sftp.posix_rename(release_target + '.tmp', release_target)
                      print('Activated complete learning-module release.')
                      print(f'Deployed {len(deploy_files)} tracked website files. No remote deletes.')
                  finally:
                      sftp.close()
              finally:
                  ssh.close()
          PY
