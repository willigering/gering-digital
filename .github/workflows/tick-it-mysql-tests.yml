name: Tick-It MySQL integration tests
on:
  pull_request:
    paths:
      - 'tick-it/**'
      - '.github/workflows/tick-it-mysql-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: integration_only_root
          MARIADB_DATABASE: tickit_ci
          MARIADB_USER: tickit_ci
          MARIADB_PASSWORD: tickit_ci_pass
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Run real database generator test
        run: php tick-it/tests/generator-db-integration.php
