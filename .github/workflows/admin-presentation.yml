name: Admin and landing checks
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, gd, zip
      - name: PHP syntax
        run: find . -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Landing page regression tests
        run: |
          php tests/dau_lib_test.php
          php tests/dau_presentation_test.php
