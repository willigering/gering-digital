name: PHP project manager checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: node --check dau-to-pro/site.js && node --check dau-to-pro/sync.js && node --check dau-to-pro/achievement-toast.js && node --check dau-to-pro/hero-fx.js && node --check tests/achievements_browser.js && node --check assets/site.js && node --check tools/dau-previews/motifs.mjs && node --check tools/dau-previews/render.mjs
      - name: Test exam finder behavior
        run: node tests/dau_exam_finder.js
      - name: Test hover focus timing and module switching
        run: node tests/dau_card_hover.js && node tests/dau_parallax.js
      - name: Validate slug and archive filenames
        run: php tests/html_project_paths.php
      - name: Test DAU page texts, preview images and hero handling
        run: php tests/dau_lib_test.php
      - name: Test admin (login, CSRF, page editor, hero upload, preview images) over HTTP
        run: php tests/admin_http_test.php
      - name: Test learner accounts (validation, spam protection, recovery, progress storage)
        run: php tests/learner_lib_test.php
      - name: Test learner accounts over HTTP (registration, login, progress API, module injection, admin)
        run: php tests/learner_http_test.php
      - name: Test achievements, level and highscore
        run: php tests/achievements_test.php
      - name: Test D2 module integration and achievement rules
        run: php tests/d2_integration_test.php
      - name: Test D1 registration, achievements and stored exam reviews
        run: php tests/d1_integration_test.php
      - name: Test automatic learning-module publication
        run: php tests/module_release_test.php
      - name: Test published module design delivery
        run: php tests/bundled_module_delivery_test.php
      - name: Test progress sync in modules
        run: node tests/learner_sync.js
      - name: Test fresh module entry, scroll reset and retained progress
        run: node tests/module_entry_test.cjs
      - name: Test B4 IPv6 domain and platform integration
        run: node tests/b4_ipv6_unit.js && php tests/b4_ipv6_integration.php
  landing-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/dtp-browser" --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/dtp-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check F2 calculations, learning flow and account integration
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-screenshots/f2
        run: node tests/f2_browser.cjs && node tests/f2_platform.cjs
      - name: Check B4 IPv6 offline and platform in real browsers
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-screenshots/b4
        run: node tests/b4_ipv6_browser.js
      - name: Check landing page in desktop and mobile browsers
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-screenshots
        run: node tests/dau_landing_browser.js
      - name: Check achievements in the real learning modules
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-screenshots/achievements
        run: node tests/achievements_browser.js
      - name: Check D2 learning flow and generators
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          D2_ARTIFACTS: ${{ runner.temp }}/dtp-screenshots/d2
        run: mkdir -p "$D2_ARTIFACTS" && node tests/d2_browser.js
      - name: Check D1 generators, learning path, exams and account restore
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-browser/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-screenshots/d1
        run: node tests/d1_browser.js && node tests/d1_account_browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dau-main-desktop-mobile
          path: ${{ runner.temp }}/dtp-screenshots
          retention-days: 7





  module-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/dtp-design" --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/dtp-design/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check all module colours and Subnetting on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/dtp-design/node_modules
          DTP_SCREENSHOT_DIR: ${{ runner.temp }}/dtp-design-screenshots
        run: node tests/module_design_browser.cjs && node tests/module_focus_browser.cjs && node tests/module_entry_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-design-desktop-mobile
          path: ${{ runner.temp }}/dtp-design-screenshots
          retention-days: 7
