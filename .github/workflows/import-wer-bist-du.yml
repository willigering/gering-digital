name: Import Wer bist du original audio once

on:
  push:
    branches: [feature/nerd-fm-wer-bist-du-public]
    paths: ['.github/workflows/import-wer-bist-du.yml']

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify uploaded original audio
        shell: bash
        env:
          SOURCE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_37S4LoRBijHlXnaxVYH0Ge08bzs/28aecf98-2199-4ab5-a653-56502ff66387.mp3
        run: |
          set -euo pipefail
          target='dau-to-pro/audio/nerd-fm/wer-bist-du.mp3'
          curl --fail --location --retry 3 --silent --show-error --output "$target" -- "$SOURCE_URL"
          echo 'b082b8025bbe91d76193bc62b42b5136c709a3610e3cf7c417d169c84f932afd  dau-to-pro/audio/nerd-fm/wer-bist-du.mp3' | sha256sum --check
          test "$(stat -c%s "$target")" -eq 2710096
      - name: Commit verified MP3 to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dau-to-pro/audio/nerd-fm/wer-bist-du.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified Diggy Thal Wer bist du original MP3'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
