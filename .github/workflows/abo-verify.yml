name: Abo-Übersicht prüfen

# Nur Prüfungen. Dieser Workflow veröffentlicht NICHTS; ein Deploy läuft
# ausschließlich über den freigegebenen STRATO-Deploy-Workflow.
on:
  pull_request:
    paths:
      - 'abo/**'
      - 'tests/abo_*'
      - '.github/workflows/abo-verify.yml'
      - '.github/workflows/abo-reminder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript und Smoke-Test
        run: |
          node --check abo/abo.js
          node tests/abo_smoke.cjs
      - name: PHP-Syntax und API-Test (temporäre Datenbanken)
        run: |
          php -l abo/api.php
          php -l abo/notify.php
          php -l abo/notify-lib.php
          php tests/abo_api_test.php
