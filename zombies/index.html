function wallLine(b,horiz,fixed,from,to,opens,ext,side){
 let cur=from;const add=(a,c,t)=>{if(c-a<1)return;const r=horiz?{x:a,y:fixed,w:c-a,h:WT}:{x:fixed,y:a,w:WT,h:c-a};

  else if(t==='door'&&b.kind!=='ruin'){const d={pc,r,hp:ext?100:70,broken:false,shake:0};pc.door=d;DOORS.push(d)}};
 for(const [o,w,t] of [...opens].sort((a,c)=>a[0]-c[0])){add(cur,from+o,'wall');add(from+o,from+o+w,t==='d'?'door':'window');cur=from+o+w}

function blocked(x,y,r,mode){

 if(hit(FSOL,x,y,r))return true;for(const w of WINDOWS){const s=w.r;if(x>s.x-r&&x<s.x+s.w+r&&y>s.y-r&&y<s.y+s.h+r)return true}return false}

const [ground,gc]=mk(MW,MH);
function noise(c,r,cols,n){for(let i=0;i<n;i++)R(c,r.x+sr()*r.w,r.y+sr()*r.h,1+sr()*2|0,1,spick(cols))}

 if(type==='wood'){R(gc,r.x,r.y,r.w,r.h,'#8a6440');for(let y=r.y;y<r.y+r.h;y+=4){R(gc,r.x,y,r.w,1,'#6e4e32');for(let x=r.x+((y/4)%3)*9;x<r.x+r.w;x+=27)R(gc,x,y,1,4,'#6e4e32')}noise(gc,r,['#946e48','#7e5a3a'],r.w*r.h/10)}
 else if(type==='tile'){for(let y=r.y;y<r.y+r.h;y+=8)for(let x=r.x;x<r.x+r.w;x+=8)R(gc,x,y,8,8,((x+y)/8)%2?'#c8c4b8':'#a8a498');noise(gc,r,['#8a867c','#b8b4a8'],r.w*r.h/20)}

 else if(type==='concrete'){R(gc,r.x,r.y,r.w,r.h,'#7a7872');noise(gc,r,['#6e6c66','#86847e'],r.w*r.h/5)}
 else{R(gc,r.x,r.y,r.w,r.h,'#4a423a');noise(gc,r,['#5a5048','#3a332d','#6e4a3a'],r.w*r.h/3)}
 for(let i=0;i<r.w*r.h/900;i++)stain(r.x+sr()*r.w,r.y+sr()*r.h,srnd(2,5),true)}
function stain(x,y,r,s){const f=s?srnd:rnd;for(let k=0;k<r*5;k++){const a=f(0,6.3),d=f(0,r);R(gc,x+Math.cos(a)*d,y+Math.sin(a)*d*.55,f(1,3),1,f(0,1)<.5?'#5e1414':'#4a0f10')}}
function buildGround(){

const RAR=[{n:'GEWÖHNLICH',c:'#c8c8c8',d:1,m:1},{n:'UNGEWÖHNLICH',c:'#5ad05a',d:1.2,m:1},{n:'RAR',c:'#4a9aff',d:1.45,m:1.25},{n:'SELTEN',c:'#ffb020',d:1.8,m:1.5}];
const rollRar=()=>{const x=Math.random();return x<.005?3:x<.055?2:x<.28?1:0};
const mkW=(k,r=0)=>{const mag=Math.round(WEAPONS[k].mag*RAR[r].m);return{k,r,ammo:mag,res:mag*3}};
const isMelee=k=>!!(WEAPONS[k]&&WEAPONS[k].melee);
// Preis für einen komplett leeren Vorrat (Magazin + max. Reserve) je Waffe
const AMMO_PRICE={pistol:150,smg:300,shotgun:350,rifle:400,magnum:300};
function wStats(pl,k){const w=WEAPONS[k],lv=pl.pap[k]||0,s=pl.slots.find(x=>x&&x.k===k),rm=RAR[(s&&s.r)||0].m;return{mag:Math.round(w.mag*(1+lv*.5)*rm),maxRes:Math.round(w.mag*(1+lv*.5)*rm)*5}}
// Nur die tatsächlich fehlende Munition kostet – volle Waffen werden nicht berechnet
function ammoCost(pl){let c=0;for(const s of pl.slots)if(s&&!isMelee(s.k)){const st=wStats(pl,s.k),cap=st.mag+st.maxRes,miss=Math.max(0,cap-s.ammo-Math.min(s.res,st.maxRes));
  if(miss>0)c+=Math.max(10,Math.ceil(miss/cap*AMMO_PRICE[s.k]/10)*10)}return c}
function refillAmmo(pl){for(const s of pl.slots)if(s&&!isMelee(s.k)){const st=wStats(pl,s.k);s.ammo=st.mag;s.res=Math.max(s.res,st.maxRes)}}
