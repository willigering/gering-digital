// =====================================================================
// Geometrie: Wände, Fenster, Möbel → Kollision

const solids=[],WINDOWS=[],FURN=[],FSOL=[],PIECES=[];
function wallLine(b,horiz,fixed,from,to,opens,ext,side){
 let cur=from;const add=(a,c,t)=>{if(c-a<1)return;const r=horiz?{x:a,y:fixed,w:c-a,h:WT}:{x:fixed,y:a,w:WT,h:c-a};
  const pc={b,r,horiz,t,ext,side,broken:false,lit:false};PIECES.push(pc);(b.pieces||(b.pieces=[])).push(pc);
  if(t==='wall')solids.push(r);else if(t==='window')WINDOWS.push(pc)};
 for(const [o,w,t] of [...opens].sort((a,c)=>a[0]-c[0])){add(cur,from+o,'wall');add(from+o,from+o+w,t==='d'?'door':'window');cur=from+o+w}
 add(cur,to,'wall')}
const FT={desk:[14,8,8,'#8a6a4a','#6a4e36'],tdesk:[26,12,9,'#7a5a3a','#5a3e26',1],locker:[10,6,22,'#5a7a9a','#46607a',1],table:[24,14,8,'#9a7a5a','#7a5a40'],
 sofa:[30,12,9,'#8a3a3a','#6a2a2a'],tv:[18,4,12,'#2a2a2e','#18181b'],bed:[22,34,7,'#e8e4dc','#b8b4ac'],wardrobe:[22,8,26,'#7a5a3a','#5e442c',1],
 fridge:[12,10,24,'#e4e4e0','#c4c4c0',1],counter:[40,10,12,'#c8c0b0','#8a7a68',1],shelf:[40,8,18,'#9a9a9a','#7a7a7a',1],register:[30,12,12,'#6a6a70','#4a4a50',1],
 crate:[12,12,10,'#a07a4a','#7a5a34',1],cabinet:[12,8,18,'#8a8a80','#6a6a62',1],bench:[30,10,12,'#8a6a4a','#5a4430',1],vending:[14,10,26,'#c03a3a','#902a2a',1]};
for(const b of BUILD){
 wallLine(b,true,b.y,b.x,b.x+b.w,b.N,true,'N');wallLine(b,true,b.y+b.h-WT,b.x,b.x+b.w,b.S,true,'S');
 wallLine(b,false,b.x,b.y+WT,b.y+b.h-WT,b.W,true,'W');wallLine(b,false,b.x+b.w-WT,b.y+WT,b.y+b.h-WT,b.E,true,'E');
 for(const [x1,y1,x2,y2,op] of b.inner){if(y1===y2)wallLine(b,true,b.y+y1-2,b.x+x1+(x1===0?WT:0),b.x+x2-(x2===b.w?WT:0),op.map(o=>[o[0]-(x1===0?WT:0),o[1],o[2]]),false,'I');
  else wallLine(b,false,b.x+x1-2,b.y+y1+(y1===0?WT:0),b.y+y2-(y2===b.h?WT:0),op.map(o=>[o[0]-(y1===0?WT:0),o[1],o[2]]),false,'I')}
 for(const [t,x,y] of b.furn){const d=FT[t],f={t,x:b.x+x,y:b.y+y,w:d[0],d:d[1],hh:d[2],top:d[3],front:d[4],cont:!!d[5],searched:false,b};FURN.push(f);FSOL.push({x:f.x,y:f.y,w:f.w,h:f.d})}

}

 {x:668,y:180,v:1,c:'#d0b050'},{x:700,y:760,v:1,c:'#555',burn:1},{x:668,y:880,v:1,c:'#7a4a8a'},
 {x:130,y:790,v:1,c:'#a33'},{x:180,y:790,v:1,c:'#ddd'},{x:330,y:790,v:1,c:'#2d4a6d'},{x:480,y:835,v:1,c:'#6d6d2d',burn:1}];
for(const c of CARS){c.w=c.v?22:44;c.h=c.v?42:22;solids.push(c)}
const PROPS=[];

prop({t:'pump',x:380,y:672,solid:[12,8]});prop({t:'pump',x:470,y:672,solid:[12,8]});prop({t:'canopy',x:330,y:620,w:200,h:90,z:42});

// Kaufstationen: Waffenstände, Munitionskisten, Upgrade-Maschine
const STATIONS=[{t:'wall',k:'smg',x:470,y:452},{t:'wall',k:'shotgun',x:1010,y:444},{t:'wall',k:'rifle',x:560,y:712},{t:'wall',k:'magnum',x:1030,y:596},

for(let i=0;i<400&&TREES.length<46;i++){const x=srnd(BL.l+10,BL.r-10),y=srnd(BL.t+20,BL.b-10);
 if(paved(x,y,10)||BUILD.some(b=>inR(b,x,y,30))||solids.some(s=>inR(s,x,y,14))||TREES.some(t=>Math.hypot(t.x-x,t.y-y)<34))continue;
 TREES.push({x,y,v:sr()*4|0,ph:sr()*6})}
for(const t of TREES)solids.push({x:t.x-3,y:t.y-4,w:6,h:5});
const FOREST=[];for(let y=20;y<MH;y+=14)for(let k=0;k<3;k++)FOREST.push({x:MW-62+k*22+srnd(-6,6),y:y+srnd(-5,5),v:4+(sr()*2|0),ph:sr()*6});
const FIRES=[];for(let y=40;y<MH;y+=38)FIRES.push({x:MW-60+srnd(-4,10),y:y+srnd(-8,8),s:srnd(9,15),ph:sr()*9});
for(const c of CARS)if(c.burn)FIRES.push({x:c.x+c.w/2,y:c.y+c.h-4,s:10,ph:sr()*9,lift:12});
for(const p of PROPS)if(p.fire)FIRES.push({x:p.x,y:p.y,s:5,ph:sr()*9,lift:10});
FIRES.push({x:900,y:700,s:12,ph:2},{x:1120,y:600,s:9,ph:5,lift:66});
const BOTTOM=[];for(let x=0;x<MW;x+=40)BOTTOM.push({x:x+srnd(-6,6),h:srnd(18,46),w:srnd(30,46)});

const hit=(list,x,y,r)=>{for(const s of list)if(x>s.x-r&&x<s.x+s.w+r&&y>s.y-r&&y<s.y+s.h+r)return true;return false};
function blocked(x,y,r,mode){
 if(x<BL.l+r||y<BL.t+r||x>BL.r-r||y>BL.b-r)return true;
 if(hit(solids,x,y,r))return true;if(mode==='bullet')return false;
 if(hit(FSOL,x,y,r))return true;for(const w of WINDOWS){const s=w.r;if(x>s.x-r&&x<s.x+s.w+r&&y>s.y-r&&y<s.y+s.h+r)return true}return false}
function move(e,dx,dy){if(!blocked(e.x+dx,e.y,e.r))e.x+=dx;if(!blocked(e.x,e.y+dy,e.r))e.y+=dy}
const insideB=(b,x,y)=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h;
const buildingAt=(x,y)=>BUILD.find(b=>insideB(b,x,y));

// =====================================================================
// Boden (inkl. Innenböden)
// =====================================================================
const [ground,gc]=mk(MW,MH);
function noise(c,r,cols,n){for(let i=0;i<n;i++)R(c,r.x+sr()*r.w,r.y+sr()*r.h,1+sr()*2|0,1,spick(cols))}
function floorTex(r,type){
 if(type==='wood'){R(gc,r.x,r.y,r.w,r.h,'#8a6440');for(let y=r.y;y<r.y+r.h;y+=4){R(gc,r.x,y,r.w,1,'#6e4e32');for(let x=r.x+((y/4)%3)*9;x<r.x+r.w;x+=27)R(gc,x,y,1,4,'#6e4e32')}noise(gc,r,['#946e48','#7e5a3a'],r.w*r.h/10)}
 else if(type==='tile'){for(let y=r.y;y<r.y+r.h;y+=8)for(let x=r.x;x<r.x+r.w;x+=8)R(gc,x,y,8,8,((x+y)/8)%2?'#c8c4b8':'#a8a498');noise(gc,r,['#8a867c','#b8b4a8'],r.w*r.h/20)}
 else if(type==='carpet'){R(gc,r.x,r.y,r.w,r.h,'#5a5e6e');noise(gc,r,['#525666','#626678','#4a4e5e'],r.w*r.h/3)}
 else if(type==='concrete'){R(gc,r.x,r.y,r.w,r.h,'#7a7872');noise(gc,r,['#6e6c66','#86847e'],r.w*r.h/5)}
 else{R(gc,r.x,r.y,r.w,r.h,'#4a423a');noise(gc,r,['#5a5048','#3a332d','#6e4a3a'],r.w*r.h/3)}
 for(let i=0;i<r.w*r.h/900;i++)stain(r.x+sr()*r.w,r.y+sr()*r.h,srnd(2,5),true)}
function stain(x,y,r,s){const f=s?srnd:rnd;for(let k=0;k<r*5;k++){const a=f(0,6.3),d=f(0,r);R(gc,x+Math.cos(a)*d,y+Math.sin(a)*d*.55,f(1,3),1,f(0,1)<.5?'#5e1414':'#4a0f10')}}
function buildGround(){
 R(gc,0,0,MW,MH,'#4f6a3a');noise(gc,{x:0,y:0,w:MW,h:MH},['#5a7843','#465f33','#62804a','#55703f'],26000);
 for(let i=0;i<600;i++){const x=sr()*MW,y=sr()*MH;R(gc,x,y,1,2,'#6f8f52');R(gc,x+1,y+1,1,1,'#3e5530')}
 for(let i=0;i<300;i++)R(gc,sr()*MW,sr()*MH,2,1,spick(['#8a6a2a','#a07a30','#6a4a20'])); // Laub
 for(let i=0;i<40;i++){const x=sr()*MW,y=sr()*MH,r=srnd(6,16);for(let k=0;k<30;k++)R(gc,x+srnd(-r,r),y+srnd(-r/2,r/2),2,1,'#5d5340')}
